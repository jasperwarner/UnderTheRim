name: D2 upset alerts

on:
  schedule:
    # 11:17 UTC = about 6:17 AM Eastern in winter, 7:17 AM from March 8 (daylight time).
    # GitHub can start scheduled runs a few minutes late.
    - cron: "17 11 * * *"
    # GitHub often delays or skips scheduled runs (it did on 2026-11-24 and 2026-11-25),
    # so there are several backup runs through the day, at odd minutes (GitHub is busiest
    # at the top of the hour). Each does the same job and replaces the day's Notion page,
    # so extra runs are harmless. In winter Eastern time these are 7:43, 8:17, 9:37 and
    # 10:53 AM, then 12:29 and 2:41 PM.
    - cron: "17 13 * * *"
    - cron: "43 12 * * *"
    - cron: "37 14 * * *"
    - cron: "53 15 * * *"
    - cron: "29 17 * * *"
    - cron: "41 19 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to check, like 2026-11-21 (leave blank for yesterday)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Check games and write the Notion page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            python -m upsets.main --date "$DATE"
          else
            python -m upsets.main
          fi

      - name: Save data files
        if: always()
        run: |
          git config user.name "d2-upsets bot"
          git config user.email "d2-upsets-bot@users.noreply.github.com"
          mkdir -p data
          git add data aliases.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "data: daily update"
            git pull --rebase
            git push
          fi
